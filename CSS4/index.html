<!DOCTYPE html>
<html> 

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colors and Opacity</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>Color Models</h1>
    <div class="palet">
        <div class="swatch named">
            Named color
        </div>
        <div class="swatch hex">
            HEX
        </div>
        <div class="swatch rgb">
            GRB
        </div>
        <div class="swatch rgba">
            RGBA
        </div>
        <div class="swatch opacity">
            <span>Opacity 0.5</span>
        </div>
        <div class="swatch rgba-background">
            <span>RGBA Background</span>
        </div>

    </div>
</body>

</html>
